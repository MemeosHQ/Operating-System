<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="MEMEOS — The Intelligence Layer for Solana Memes">
  <defs>
    <!-- Official MEMEOS mark gradient — verbatim from public/brand/logo-mark.svg -->
    <linearGradient id="mop" x1="0" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#7C6AF0"/>
      <stop offset="0.35" stop-color="#A855F7"/>
      <stop offset="0.62" stop-color="#C13FE4"/>
      <stop offset="1" stop-color="#43104F"/>
    </linearGradient>
    <!-- Ambient depth: restrained brand-tinted glows (offset from the logo) -->
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C6AF0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7C6AF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.38" cy="0.44" r="0.85">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Background: void -->
  <rect width="1600" height="900" fill="#050608"/>

  <!-- Faint structural grid -->
  <path d="M80 0V900 M160 0V900 M240 0V900 M320 0V900 M400 0V900 M480 0V900 M560 0V900 M640 0V900 M720 0V900 M800 0V900 M880 0V900 M960 0V900 M1040 0V900 M1120 0V900 M1200 0V900 M1280 0V900 M1360 0V900 M1440 0V900 M1520 0V900" stroke="#ffffff" stroke-opacity="0.017" stroke-width="1" fill="none"/>
  <path d="M0 80H1600 M0 160H1600 M0 240H1600 M0 320H1600 M0 400H1600 M0 480H1600 M0 560H1600 M0 640H1600 M0 720H1600 M0 800H1600 M0 880H1600" stroke="#ffffff" stroke-opacity="0.017" stroke-width="1" fill="none"/>

  <!-- Ambient glows -->
  <ellipse cx="1240" cy="340" rx="640" ry="440" fill="url(#glowA)"/>
  <ellipse cx="240" cy="880" rx="620" ry="380" fill="url(#glowB)"/>

  <!-- Faint signal constellation — rising, abstract, no axes / no data -->
  <path d="M920 660 L1030 588 L1105 612 L1210 505 L1288 528 L1372 412 L1452 336" stroke="#a18dff" stroke-opacity="0.20" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1030 588 L1080 470 L1180 432 M1210 505 L1264 640 M1372 412 L1300 220 M1452 336 L1470 560 L1330 610" stroke="#7b61ff" stroke-opacity="0.10" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#a18dff">
    <circle cx="920" cy="660" r="3" fill-opacity="0.30"/>
    <circle cx="1030" cy="588" r="3.5" fill-opacity="0.42"/>
    <circle cx="1105" cy="612" r="2.5" fill-opacity="0.26"/>
    <circle cx="1210" cy="505" r="4" fill-opacity="0.50"/>
    <circle cx="1288" cy="528" r="2.5" fill-opacity="0.28"/>
    <circle cx="1372" cy="412" r="4.5" fill-opacity="0.55"/>
    <circle cx="1452" cy="336" r="5" fill-opacity="0.68"/>
  </g>
  <g fill="#a18dff">
    <circle cx="1080" cy="470" r="2" fill-opacity="0.16"/>
    <circle cx="1180" cy="432" r="2.5" fill-opacity="0.20"/>
    <circle cx="1264" cy="640" r="2" fill-opacity="0.14"/>
    <circle cx="1300" cy="220" r="2.5" fill-opacity="0.18"/>
    <circle cx="1470" cy="560" r="2" fill-opacity="0.14"/>
    <circle cx="1330" cy="610" r="2" fill-opacity="0.12"/>
    <circle cx="1120" cy="250" r="2" fill-opacity="0.12"/>
    <circle cx="980" cy="770" r="2" fill-opacity="0.10"/>
  </g>

  <!-- ══ Official MEMEOS mark — exact geometry, exact gradient, untouched ══ -->
  <g transform="translate(120,200) scale(0.6624)">
    <path d="M0 237 H150 V447 H0 Z" fill="url(#mop)"/>
    <path d="M150 79 H265 Q275 215 355 240 V282 Q255 300 210 447 H150 Z" fill="url(#mop)"/>
    <path d="M355 0 A490 447 0 0 1 845 447 H565 Q490 285 448 233 V447 H355 Z" fill="url(#mop)"/>
  </g>

  <!-- ══ Official MEMEOS wordmark — exact monoline vector, untouched ══ -->
  <g transform="translate(122,556) scale(4.55)">
    <g fill="none" stroke="#F2F4F8" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 1 14.5 V 1.5 L 6 8 L 11 1.5 V 14.5"/>
      <path d="M 18.5 1.5 H 11 V 14.5 H 18.5 M 11 8 H 16.5"/>
      <path d="M 25.5 14.5 V 1.5 L 30.5 8 L 35.5 1.5 V 14.5"/>
      <path d="M 43 1.5 H 35.5 V 14.5 H 43 M 35.5 8 H 41"/>
      <path d="M 53 1.7 C 55.8 1.7 57.4 3.2 57.4 8 C 57.4 12.8 55.8 14.3 53 14.3 C 50.2 14.3 48.6 12.8 48.6 8 C 48.6 3.2 50.2 1.7 53 1.7 Z"/>
      <path d="M 68.4 3.4 C 68.4 1.9 67 1.5 64.8 1.5 C 62.7 1.5 61.3 2.3 61.3 4 C 61.3 5.9 63 6.4 64.7 6.9 C 66.5 7.4 68.3 7.9 68.3 10 C 68.3 12.3 66.8 14.5 64.7 14.5 C 62.5 14.5 61.2 13.4 61.2 11.8"/>
    </g>
  </g>

  <!-- Accent hairline rule -->
  <rect x="122" y="676" width="56" height="2" fill="#7b61ff" fill-opacity="0.9"/>

  <!-- Statement -->
  <text x="120" y="722" fill="#e9ebef" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" letter-spacing="5">THE INTELLIGENCE LAYER</text>
  <text x="120" y="768" fill="#a18dff" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" letter-spacing="5">FOR SOLANA MEMES</text>

  <!-- Supporting line -->
  <text x="121" y="818" fill="#8c93a0" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="21" letter-spacing="0.5">See what moves. Understand why.</text>

  <!-- Ticker label, top-right -->
  <text x="1480" y="110" text-anchor="end" fill="#8c93a0" fill-opacity="0.85" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="5">$MEMEOS</text>

  <!-- Vignette -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
